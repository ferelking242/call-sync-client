name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.38.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      # ── Version ───────────────────────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --split-per-abi \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── Locate APK ────────────────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -name '*-release.apk' | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No split release APK found in $APK_DIR"
            find build -name "*.apk" 2>/dev/null | head -5
            exit 1
          fi
          mkdir -p release
          for APK in "$APK_DIR"/*-release.apk; do
            ABI=$(basename "$APK" | sed 's/^app-//; s/-release\.apk$//')
            DEST="release/callsync-client-${{ steps.version.outputs.version }}-${ABI}.apk"
            cp "$APK" "$DEST"
            echo "Found: $DEST  ($(du -sh "$APK" | cut -f1))"

      # ── Upload as workflow artifact ───────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callsync-client-${{ steps.version.outputs.version }}
          path: release/*.apk
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Delete previous release/tag if exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes 2>/dev/null || true
          git push --delete origin "${{ steps.version.outputs.tag }}" 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release/*.apk \
            --title "CallSync Client ${{ steps.version.outputs.version }}" \
            --notes "## CallSync Client ${{ steps.version.outputs.version }}

          Build automatique depuis \`main\`.

          Les APK sont séparées par architecture Android pour réduire la taille du téléchargement.

          ### Installation
          1. Télécharger l’APK correspondant à l’architecture du téléphone
          2. Ouvrir le fichier sur Android
          3. Autoriser l'installation depuis sources inconnues si demandé" \
            --latest
