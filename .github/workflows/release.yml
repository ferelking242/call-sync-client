name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    paths:
      - 'call-sync-client/pubspec.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ── Version ───────────────────────────────────────────────────────────
      - name: Extract version
        id: version
        working-directory: call-sync-client
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: call-sync-client
        run: flutter pub get

      - name: Build release APK
        working-directory: call-sync-client
        run: flutter build apk --release --no-tree-shake-icons --verbose

      # ── Locate APK ────────────────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          APK="call-sync-client/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            find call-sync-client/build -name "*.apk" 2>/dev/null | head -5
            exit 1
          fi
          echo "Found: $APK  ($(du -sh "$APK" | cut -f1))"
          DEST="callsync-client-${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      # ── Upload as workflow artifact ───────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callsync-client-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.dest }}
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Delete previous release/tag if exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes 2>/dev/null || true
          git push --delete origin "${{ steps.version.outputs.tag }}" 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.apk.outputs.dest }}" \
            --title "CallSync Client ${{ steps.version.outputs.version }}" \
            --notes "## CallSync Client ${{ steps.version.outputs.version }}

          Build automatique depuis \`main\`.

          ### Installation
          1. Télécharger \`${{ steps.apk.outputs.dest }}\`
          2. Ouvrir le fichier sur Android
          3. Autoriser l'installation depuis sources inconnues si demandé" \
            --latest
