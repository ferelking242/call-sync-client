name: Build & Release Flutter APK

on:
  push:
    branches: [ main ]
    paths:
      - 'call-sync-client/pubspec.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Extract version
        id: version
        working-directory: call-sync-client
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Install dependencies
        working-directory: call-sync-client
        run: flutter pub get

      - name: Build release APK
        working-directory: call-sync-client
        run: flutter build apk --release --no-tree-shake-icons

      - name: Copy APK to workspace root
        run: |
          APK_SRC="call-sync-client/build/app/outputs/flutter-apk/app-release.apk"
          APK_DST="callsync-client-${{ steps.version.outputs.version }}.apk"
          echo "Source: $APK_SRC"
          ls -lh "$APK_SRC"
          cp "$APK_SRC" "$APK_DST"
          echo "Copied to: $APK_DST"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: callsync-client-${{ steps.version.outputs.version }}
          path: callsync-client-${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Delete existing tag and release (if any)
        continue-on-error: true
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes 2>/dev/null || true
          git push --delete origin "${{ steps.version.outputs.tag }}" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "callsync-client-${{ steps.version.outputs.version }}.apk" \
            --title "CallSync Client ${{ steps.version.outputs.version }}" \
            --notes "## CallSync Client ${{ steps.version.outputs.version }}

          Build automatique depuis \`main\`.

          ### Installation
          1. Télécharger \`callsync-client-${{ steps.version.outputs.version }}.apk\`
          2. Ouvrir le fichier sur votre appareil Android
          3. Autoriser l'installation depuis des sources inconnues si demandé" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
